<!DOCTYPE html>
<html lang="en">
<head>
   <title>For of</title>
</head>
<body>
    <script>
        let miArray = [5, 9, 6, 4, 8];
        let suma = 0;

        function testLoop(array) {
            for (let numero of array) {
                suma += numero;
            }
            console.log(suma)
        }
        testLoop(miArray)
    </script>
</body>
</html>
