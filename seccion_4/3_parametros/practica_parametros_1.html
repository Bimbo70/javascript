<!DOCTYPE html>
<html>

<head>
    <title>Practica_Parametros_1</title>
</head>

<body>
    <p>Primer Numero</p>
    <input type="number" id="primerNumero">
    <p>Segundo Numero</p>
    <input type="number" id="segundoNumero">
    <button onclick="mostrarResultado()">Calcular</button>
    <h2 id="textoResultado"></h2>

    <script>
        function suma(numero1, numero2) {
            resultado = numero1 + numero2;
            return resultado;
        }

        function mostrarResultado() {
            let elementoNumero1 = parseInt(document.getElementById("primerNumero").value);
            let elementoNumero2 = parseInt(document.getElementById("segundoNumero").value);
            let elementoTexto = document.getElementById("textoResultado");
            let elementoSuma = suma(elementoNumero1,
                elementoNumero2);
            elementoTexto.textContent = elementoSuma;
            alert(resultado)
        }
    </script>
</body>

</html>
