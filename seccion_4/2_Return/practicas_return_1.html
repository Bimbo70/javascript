<!DOCTYPE html>
<html>
    <head>
        <title>Return</title>
    </head>
    <body>
        <p>
            <button onclick="mostrarResultado()">Click aqui</button>
        </p>
        <script>
            function mostrarResultado() {
                let resultado = sumar();
                alert(resultado)
            }
            function sumar(){
                resultado = 15 + 19;
                return resultado
            }

            let numero = "El numero es " + sumar();
            alert(numero)
        </script>
    </body>
</html>
